apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-user-service-dev
spec:
  replicas: 0
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: micro-user-service-dev
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: micro-user-service-dev
    spec:
      containers:
        - name: app
          image: 111111111111.dkr.ecr.ap-northeast-2.amazonaws.com/micro-user-service-dev
          ports:
            - containerPort: 8871
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev