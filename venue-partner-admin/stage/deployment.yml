apiVersion: apps/v1
kind: Deployment
metadata:
  name: venue-partner-admin-stage
spec:
  replicas: 0
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: venue-partner-admin-stage
  strategy:
      type: RollingUpdate
  template:
    metadata:
      labels: 
        app: venue-partner-admin-stage
        version: v1.0
        app.kubernetes.io/name: venue-partner-admin-stage
    spec:
      containers:
        - name: venue-partner-admin-stage
          image: 222222222222.dkr.ecr.ap-northeast-2.amazonaws.com/venue-partner-admin-stage
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /admin/
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: stage