apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-beacon-service-dev
spec:
  replicas: 0
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: micro-beacon-service-dev
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        # app: micro-beacon-service-dev
        # version: v1.0
        app.kubernetes.io/name: micro-beacon-service-dev
    spec:
      containers:
        - name: app
          image: 111111111111.dkr.ecr.ap-northeast-2.amazonaws.com/micro-beacon-service-dev
          resources: {}
          readinessProbe:
            httpGet:
              path: /
              port: 8879
            initialDelaySeconds: 5
            periodSeconds: 3
          ports:
            - containerPort: 8879
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
