apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: acmemall-backend-prod-excel-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: acmemall-backend-prod-excel-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 5
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 5
