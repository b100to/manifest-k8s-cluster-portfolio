apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: acmemall-backend-stage
  annotations:
    argocd.argoproj.io/hook: Skip
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: acmemall-backend-stage
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 40
      policies:
      - type: Pods
        value: 1
        periodSeconds: 5
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 5
