apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-backend
spec:
  replicas: 0
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: health-backend
  strategy:
      type: RollingUpdate
  template:
    metadata:
      labels: 
        app: health-backend
        version: v1.0
        app.kubernetes.io/name: health-backend
    spec:
      containers:
        - name: health-backend
          image: 222222222222.dkr.ecr.ap-northeast-2.amazonaws.com/health-backend-prod
          ports:
            - containerPort: 8001
          env:
            - name: DJANGO_ENV
              value: prod
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: partner-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: partner-secret
                  key: AWS_SECRET_ACCESS_KEY