apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "acmemall-backend-v4.fullname" . }}
  labels:
    {{- include "acmemall-backend-v4.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "acmemall-backend-v4.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "acmemall-backend-v4.templateLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "acmemall-backend-v4.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
{{/*          {{- if .Values.livenessProbe.enabled }}*/}}
{{/*          livenessProbe:*/}}
{{/*            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}*/}}
{{/*            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}*/}}
{{/*            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}*/}}
{{/*            successThreshold: {{ .Values.livenessProbe.successThreshold }}*/}}
{{/*            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}*/}}
{{/*            httpGet:*/}}
{{/*              path: /actuator/health/liveness*/}}
{{/*              port: http*/}}
{{/*          {{- end }}*/}}
{{/*          {{- if .Values.readinessProbe.enabled }}*/}}
{{/*          readinessProbe:*/}}
{{/*            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}*/}}
{{/*            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}*/}}
{{/*            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}*/}}
{{/*            successThreshold: {{ .Values.readinessProbe.successThreshold }}*/}}
{{/*            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}*/}}
{{/*            httpGet:*/}}
{{/*              path: /actuator/health/readiness*/}}
{{/*              port: http*/}}
{{/*          {{- end }}*/}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

