apiVersion: v1
kind: Service
metadata:
  name: {{ include "infinispan.fullname" . }}
  labels:
    {{- include "infinispan.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.hotrod.type }}
  sessionAffinity: None
  ports:
    - name: {{ .Values.service.hotrod.name }}
      port: {{ .Values.service.hotrod.port }}
      targetPort: {{ .Values.service.hotrod.port }}
      protocol: TCP
  selector:
    {{- include "infinispan.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infinispan.fullname" . }}-headless
  labels:
    app.kubernetes.io/component: headless
spec:
  type: {{ .Values.service.jgroups.type }}
  sessionAffinity: None
  clusterIP: None
  ports:
    - name: {{ .Values.service.jgroups.name }}
      port: {{ .Values.service.jgroups.port }}
      targetPort: {{ .Values.service.jgroups.port }}
      protocol: TCP
  selector:
    {{- include "infinispan.selectorLabels" . | nindent 4 }}