apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-gateway
spec:
  replicas: 0
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-gateway
  strategy:
      type: RollingUpdate
  template:
    metadata:
      labels: 
        app: cloud-gateway
        version: v1.0
        app.kubernetes.io/name: cloud-gateway
    spec:
      containers:
        - name: cloud-gateway
          image: 222222222222.dkr.ecr.ap-northeast-2.amazonaws.com/cloud-gateway-prod
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
          ports:
            - containerPort: 8088
          readinessProbe:
            httpGet:
              path: /
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 5
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: partner-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: partner-secret
                  key: AWS_SECRET_ACCESS_KEY
