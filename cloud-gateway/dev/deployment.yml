apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-gateway-dev
spec:
  replicas: 0
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-gateway-dev
  strategy:
      type: RollingUpdate
  template:
    metadata:
      labels: 
        app: cloud-gateway-dev
        version: v1.0
        app.kubernetes.io/name: cloud-gateway-dev
    spec:
      containers:
        - name: cloud-gateway-dev
          image: 111111111111.dkr.ecr.ap-northeast-2.amazonaws.com/cloud-gateway-dev
          ports:
            - containerPort: 8088
          readinessProbe:
            httpGet:
              path: /
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 5
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: partner-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: partner-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: ap-northeast-2
            - name: AWS_REGION
              value: ap-northeast-2
