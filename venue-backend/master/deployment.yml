apiVersion: apps/v1
kind: Deployment
metadata:
  name: venue-backend
spec:
  replicas: 0
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: venue-backend
  strategy:
      type: RollingUpdate
  template:
    metadata:
      labels: 
        app: venue-backend
        version: v1.0
        app.kubernetes.io/name: venue-backend
    spec:
      containers:
        - name: venue-backend
          image: 222222222222.dkr.ecr.ap-northeast-2.amazonaws.com/venue-backend-master:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: partner-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: partner-secret
                  key: AWS_SECRET_ACCESS_KEY