apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-registration-macro-dev
spec:
  replicas: 0
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: member-registration-macro-dev
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        # app: member-registration-macro-dev
        # version: v1.0
        app.kubernetes.io/name: member-registration-macro-dev
    spec:
      containers:
        - name: app
          image: 111111111111.dkr.ecr.ap-northeast-2.amazonaws.com/member-registration-macro-dev
          resources: {}
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: partner-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: partner-secret
                  key: AWS_SECRET_ACCESS_KEY
