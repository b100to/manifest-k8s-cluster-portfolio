apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-django-admin-stage
spec:
  replicas: 0
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: partner-django-admin-stage
  strategy:
      type: RollingUpdate
  template:
    metadata:
      labels: 
        app: partner-django-admin-stage
        version: v1.0
        app.kubernetes.io/name: partner-django-admin-stage
    spec:
      containers:
        - name: partner-django-admin-stage
          image: 222222222222.dkr.ecr.ap-northeast-2.amazonaws.com/partner-django-admin-stage
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
          env:
            - name: DJANGO_ENV
              value: stage