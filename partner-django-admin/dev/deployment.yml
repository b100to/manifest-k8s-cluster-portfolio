apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-django-admin-dev
spec:
  replicas: 0
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: partner-django-admin-dev
  strategy:
      type: RollingUpdate
  template:
    metadata:
      labels: 
        app: partner-django-admin-dev
        version: v1.0
        app.kubernetes.io/name: partner-django-admin-dev
    spec:
      containers:
        - name: partner-django-admin-dev
          image: 111111111111.dkr.ecr.ap-northeast-2.amazonaws.com/partner-django-admin-dev
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
          env:
            - name: DJANGO_ENV
              value: dev
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: partner-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: partner-secret
                  key: AWS_SECRET_ACCESS_KEY
